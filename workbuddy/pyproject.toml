[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerecon"
version = "0.1.0"
description = "电力看经济智能体 —— LLM 可调度的工具层与智能体循环"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.4"]

[project.scripts]
powerecon = "powerecon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
