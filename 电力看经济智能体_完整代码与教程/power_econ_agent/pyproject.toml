[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-economy-agent"
version = "0.1.0"
description = "Feature-disentangled, knowledge-enhanced power-economy agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Power Economy Agent Project"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "httpx>=0.27,<1",
  "networkx>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
real-data = [
  "akshare>=1.18.64,<2",
  "holidays>=0.60,<1",
]
llm = ["openai>=2.45,<3"]
mcp = ["mcp>=1.27,<2"]
ui = [
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]
all = [
  "akshare>=1.18.64,<2",
  "holidays>=0.60,<1",
  "openai>=2.45,<3",
  "mcp>=1.27,<2",
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
]

[project.scripts]
power-econ = "power_econ.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
